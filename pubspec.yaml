name: filemanager
description: filemanager - Professional File Manager & Storage Cleaner
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Ads
  google_mobile_ads: ^5.1.0

  # File system
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  open_file: ^3.3.2
  share_plus: ^9.0.0
  mime: ^1.0.4

  # Media
  video_thumbnail: ^0.5.3
  photo_manager: ^3.3.0

  # Storage
  disk_space_plus: ^0.2.4

  # UI
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  lottie: ^3.1.0
  fl_chart: ^0.68.0

  # Utils
  intl: ^0.19.0
  crypto: ^3.0.3
  shared_preferences: ^2.2.2
  get_it: ^7.6.7
  provider: ^6.1.2
  collection: ^1.18.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # 🛠️ గిట్‌హబ్ బిల్డ్ రన్నర్ కోసం లాంచర్ ఐకాన్స్ & స్ప్లాష్ స్క్రీన్ ప్యాకేజీలను ఇక్కడ యాడ్ చేసాం
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

# ─── 🛠️ App Icons Generator Config ───
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

# ─── 🛠️ Splash Screen Generator Config ───
flutter_native_splash:
  color: "#000000" # AMOLED Black బ్యాక్‌గ్రౌండ్ కలర్
  image: "assets/splash/splash_logo.png"
  android_12:
    image: "assets/splash/splash_logo.png"
    color: "#000000"

flutter:
  uses-material-design: true
  
  # ─── 🛠️ అసెట్స్ ఫోల్డర్స్ మ్యాపింగ్ ───
  assets:
    - assets/lottie/
    - assets/images/
    - assets/icon/       # మీ ఐకాన్ ఇమేజ్ ఉండే ఫోల్డర్ 
    - assets/splash/     # మీ స్ప్లాష్ లోగో ఉండే ఫోల్డర్
